# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket claims a delay/authority that the DB does not back
stale_policy: FM-06            # superseded or not-yet-effective clause cited
clause_sum: FM-04              # asks to add up clauses instead of taking the larger
double_deduct: FM-05           # prior refund on the same order subtracted twice
sibling_refund: FM-07          # batch request refunds a sibling claim's order
denied_ignored: FM-02          # approval denied/expired but agent reports success
reply_ledger_mismatch: FM-08   # reply states an amount other than the ledger holds
cross_principal: FM-09         # asks for another principal's order or data
